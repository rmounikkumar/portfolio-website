<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FACC15;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1"/>
    </linearGradient>
    <style>
      @keyframes fillBar { from { width: 0; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .skill-row { animation: fadeIn 0.6s ease-out both; }
      .skill-row:nth-child(1) { animation-delay: 0.1s; }
      .skill-row:nth-child(2) { animation-delay: 0.2s; }
      .skill-row:nth-child(3) { animation-delay: 0.3s; }
      .skill-row:nth-child(4) { animation-delay: 0.4s; }
      .skill-row:nth-child(5) { animation-delay: 0.5s; }
      .skill-row:nth-child(6) { animation-delay: 0.6s; }
      .skill-row:nth-child(7) { animation-delay: 0.7s; }
      .skill-row:nth-child(8) { animation-delay: 0.8s; }
      .bar-fill { animation: fillBar 1.2s ease-out both; animation-delay: inherit; }
      .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="600" height="380" rx="16" fill="#0a0a0a"/>
  <text x="300" y="40" text-anchor="middle" font-family="monospace" font-size="14" fill="#FACC15" font-weight="bold" letter-spacing="3">CODING ACTIVITY</text>
  <line x1="40" y1="55" x2="560" y2="55" stroke="#FACC15" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Languages -->
  <g class="skill-row" transform="translate(40, 80)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">JavaScript</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Primary</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="500" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.2s"/>
    <circle class="pulse-dot" cx="520" cy="24" r="3" fill="#22c55e"/>
  </g>

  <g class="skill-row" transform="translate(40, 120)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">TypeScript</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Fluent</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="460" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.3s"/>
    <circle class="pulse-dot" cx="480" cy="24" r="3" fill="#22c55e"/>
  </g>

  <g class="skill-row" transform="translate(40, 160)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">Python</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Learning</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="340" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.4s"/>
    <circle class="pulse-dot" cx="360" cy="24" r="3" fill="#eab308"/>
  </g>

  <g class="skill-row" transform="translate(40, 200)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">Java</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Building</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="300" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.5s"/>
    <circle class="pulse-dot" cx="320" cy="24" r="3" fill="#eab308"/>
  </g>

  <line x1="40" y1="235" x2="560" y2="235" stroke="#FACC15" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Frameworks & Tools -->
  <g class="skill-row" transform="translate(40, 255)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">React / Next.js</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Production</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="480" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.6s"/>
    <circle class="pulse-dot" cx="500" cy="24" r="3" fill="#22c55e"/>
  </g>

  <g class="skill-row" transform="translate(40, 295)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">Node.js / Express</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Production</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="470" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.7s"/>
    <circle class="pulse-dot" cx="490" cy="24" r="3" fill="#22c55e"/>
  </g>

  <g class="skill-row" transform="translate(40, 335)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">MongoDB / MySQL</text>
    <text x="130" y="12" font-family="monospace" font-size="10" fill="#FACC15">Active</text>
    <rect x="0" y="20" width="520" height="8" rx="4" fill="#1a1a1a"/>
    <rect class="bar-fill" x="0" y="20" width="420" height="8" rx="4" fill="url(#barGrad)" style="animation-delay: 0.8s"/>
    <circle class="pulse-dot" cx="440" cy="24" r="3" fill="#22c55e"/>
  </g>

  <!-- Legend -->
  <circle cx="380" cy="28" r="3" fill="#22c55e"/>
  <text x="390" y="32" font-family="monospace" font-size="8" fill="#666">Active</text>
  <circle cx="440" cy="28" r="3" fill="#eab308"/>
  <text x="450" y="32" font-family="monospace" font-size="8" fill="#666">Learning</text>
</svg>
